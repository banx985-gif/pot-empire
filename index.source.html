  <script>
    // The loading screen: the van rolls along the road as each part of the game arrives.
    (function () {
      var total = 94, got = 0;
      document.addEventListener('load', function (e) {
        if (!e.target || e.target.tagName !== 'SCRIPT') return;
        got++;
        var t = Math.min(1, got / total), bar = document.getElementById('load-bar'), van = document.getElementById('load-van');
        if (bar) bar.style.width = (t * 100) + '%';
        if (van) van.style.left = 'calc(' + (t * 100) + '% - 28px)';
      }, true);
    })();
  </script>
