  <div id="loading"><div class="load-scene"><img class="load-bg" src="assets/intro/LOAD-01.webp" alt="" draggable="false"><img class="load-logo" src="assets/ui/LOGO-01.webp" alt="Pot Empire Tycoon" draggable="false"><div id="load-peel"></div></div><div class="load-foot"><div class="load-road"><i id="load-bar"></i><span id="load-cart"></span></div><p id="load-text">Rolling up to the garage...</p></div></div>
  <script src="data/load_peeloff.js"></script>
  <script>
    // The loading screen (job 19): Budz pulls up in his van (LOAD-02), flashes a peace sign, skids and speeds off up the
    // road, played once from Aaron's LOAD-02-PEELOFF timeline (data/load_peeloff.js: each step says which pose, where on a
    // 960x640 stage and how big). The stage spans the road picture's width, along its bottom. Uncle Haze's golf cart
    // (VEH-04-DRIVERIGHT) rides along at the front edge of the loading bar as it fills.
    (function () {
      var total = 94, got = 0, shown = 0, start = Date.now();
      var P = window.PE_PEELOFF, peelStart = 0, peelEnd = 0, peelMs = 0, i;
      if (P) for (i = 0; i < P.steps.length; i++) peelMs += P.steps[i][1];
      function bar(t) {
        var b = document.getElementById('load-bar'), c = document.getElementById('load-cart');
        if (b) b.style.width = (t * 100) + '%';
        if (c) c.style.left = (t * 100) + '%';
      }
      function peel() {
        var box = document.getElementById('load-peel');
        if (!box || !P || !peelStart) return;
        var el = box.firstChild, at = Date.now() - peelStart, k = 0, s;
        while (k < P.steps.length - 1 && at >= P.steps[k][1]) { at -= P.steps[k][1]; k++; }
        s = P.steps[k];
        if (Date.now() >= peelEnd || s[0] < 0) { el.style.display = 'none'; return; }
        var scene = box.parentNode, W = scene.clientWidth, H = scene.clientHeight, f = W / P.stage[0], top = H - P.stage[1] * f;
        var size = P.src * s[4] * f, rows = Math.ceil(12 / P.cols), col = s[0] % P.cols, row = Math.floor(s[0] / P.cols);
        el.style.display = 'block';
        el.style.width = size + 'px';
        el.style.height = size + 'px';
        el.style.left = (s[2] * f - (s[5] / P.src) * size) + 'px';
        el.style.top = (top + s[3] * f - (s[6] / P.src) * size) + 'px';
        el.style.backgroundSize = (P.cols * 100) + '% ' + (rows * 100) + '%';
        el.style.backgroundPosition = (P.cols > 1 ? (col / (P.cols - 1)) * 100 : 0) + '% ' + (rows > 1 ? (row / (rows - 1)) * 100 : 0) + '%';
      }
      // How long the game should keep the loading screen up for Budz to finish (js/ui/feel.js asks when it's ready).
      window.PE_LOAD_WAIT = function () { return peelStart ? Math.max(0, peelEnd - Date.now()) : 0; };
      if (P) {
        var img = new Image();
        img.onload = function () {
          var box = document.getElementById('load-peel');
          if (!box) return;
          var el = document.createElement('i');
          el.style.backgroundImage = 'url(' + P.sheet + ')';
          box.appendChild(el);
          peelStart = Date.now();
          peelEnd = peelStart + peelMs;
        };
        img.src = P.sheet;
      }
      // Each script that arrives moves the bar on; between them it creeps, so it never sits still (the published game is one big script).
      function tick() {
        if (!document.getElementById('loading')) return;
        var creep = 0.8 * (1 - Math.exp(-(Date.now() - start) / 7000));
        var want = Math.max(Math.min(1, got / total), creep);
        if (window.PE_LOADED) want = 1;
        if (want > shown) { shown += (want - shown) * 0.2; bar(shown); }
        peel();
        requestAnimationFrame(tick);
      }
      document.addEventListener('load', function (e) { if (e.target && e.target.tagName === 'SCRIPT') got++; }, true);
      bar(0);
      requestAnimationFrame(tick);
    })();
  </script>
