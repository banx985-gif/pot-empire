<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1d0f33">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Pot Empire Tycoon</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div id="loading"><img class="load-logo" src="assets/ui/LOGO-01.webp" alt="Pot Empire Tycoon" draggable="false"><div class="load-road"><img id="load-van" src="assets/map/VEH-01.webp" alt="" draggable="false"><i id="load-bar"></i></div><p id="load-text">Rolling up to the garage...</p></div>
  <script>
    // The loading screen: the van rolls along the road as each part of the game arrives.
    (function () {
      var total = 3, got = 0;
      document.addEventListener('load', function (e) {
        if (!e.target || e.target.tagName !== 'SCRIPT') return;
        got++;
        var t = Math.min(1, got / total), bar = document.getElementById('load-bar'), van = document.getElementById('load-van');
        if (bar) bar.style.width = (t * 100) + '%';
        if (van) van.style.left = 'calc(' + (t * 100) + '% - 28px)';
      }, true);
    })();
  </script>
  <script src="js/ui/log.js"></script>
  <div id="safe-probe" aria-hidden="true"></div>
  <div id="game"></div>
  <div id="ui">
    <div id="hud" hidden></div>
    <div id="actionbar" hidden></div>
    <div id="tools" hidden></div>
    <div id="edges"></div>
    <nav id="bottomnav" hidden></nav>
    <div id="panel" hidden></div>
    <div id="modal" hidden></div>
    <div id="toasts"></div>
    <div id="celebrate" hidden></div>
    <div id="helper" hidden></div>
    <div id="travel" hidden></div>
    <div id="reveal" hidden></div>
    <div id="juice" aria-hidden="true"></div>
    <div id="tutor" hidden></div>
    <div id="intro" hidden></div>
    <div id="agegate" hidden></div>
    <div id="fps" hidden></div>
  </div>
  <pre id="fatal" hidden></pre>

  <script src="vendor/phaser.min.js"></script>
  <script src="js/game.bundle.js"></script>
</body>
</html>
